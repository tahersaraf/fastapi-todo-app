<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="auth-container">

    <div class="card auth-card">

        <h1 class="auth-title">Edit Task</h1>
        <p class="auth-subtitle">Update your task details.</p>

        <form method="post" action="/tasks/{{ task.id }}/update">

            <div class="input-group">
                <label>Task Title</label>
                <input type="text" name="title" value="{{ task.title }}" required>
            </div>

            <div class="input-group">
                <label>Status</label>
                <select name="completed" class="form-control">
                    <option value="0" {% if not task.completed %}selected{% endif %}>Pending</option>
                    <option value="1" {% if task.completed %}selected{% endif %}>Completed</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    Update Task
                </button>
                <a href="/" class="btn btn-secondary" style="flex: 1; display: inline-flex; align-items: center; justify-content: center;">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
